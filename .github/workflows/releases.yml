name: Validate release index
on:
  push:
    paths:
      - "releases.json"
      - "scripts/validate_releases.py"
      - ".github/workflows/releases.yml"
  pull_request:
    paths:
      - "releases.json"
      - "scripts/validate_releases.py"
      - ".github/workflows/releases.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check catalog and immutable source commits
        run: |
          git show origin/main:releases.json > /tmp/pjpm-baseline.json 2>/dev/null || printf '{"schema":1,"packages":{}}\n' > /tmp/pjpm-baseline.json
          python scripts/validate_releases.py releases.json --baseline /tmp/pjpm-baseline.json --check-git
