name: Validate release index
on:
  push:
    paths:
      - "releases.json"
      - "scripts/validate_releases.py"
      - ".github/workflows/releases.yml"
  pull_request:
    paths:
      - "releases.json"
      - "scripts/validate_releases.py"
      - ".github/workflows/releases.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_releases.py
