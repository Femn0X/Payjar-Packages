name: pygame cross-platform
on:
  push:
    paths:
      - 'releases/pygame/**'
      - '.github/workflows/pygame-ci.yml'
  pull_request:
    paths:
      - 'releases/pygame/**'
      - '.github/workflows/pygame-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: releases/pygame/0.1.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable test --all-targets
      - run: cargo +stable test --release
      - run: cargo +stable build --release
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, i686-unknown-linux-gnu, aarch64-linux-android, aarch64-apple-ios, aarch64-pc-windows-msvc]
    defaults:
      run:
        working-directory: releases/pygame/0.1.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - run: cargo +stable check --target ${{ matrix.target }} --all-targets
